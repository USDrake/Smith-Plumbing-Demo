<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#153b59">
  <title>Smith Plumbing | Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #153b59;
      background: #f5f8fb;
      text-align: center;
    }
    main {
      width: 100%;
      max-width: 560px;
      background: #fff;
      border: 1px solid #e0e8ef;
      border-radius: 18px;
      padding: clamp(28px, 6vw, 56px);
      box-shadow: 0 14px 40px rgba(21, 59, 89, 0.07);
    }
    .mark { font-size: 2.3rem; line-height: 1; margin-bottom: 16px; }
    h1 { margin: 0 0 12px; font-size: clamp(2rem, 5vw, 2.7rem); }
    p { margin: 0; line-height: 1.65; color: #536578; }
    .status {
      display: inline-block;
      margin-bottom: 20px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #eaf2f8;
      color: #245a7b;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">🔧</div>
    <span class="status">Website in progress</span>
    <h1>Smith Plumbing</h1>
    <p>Our new website is coming soon. Check back for updates.</p>
  </main>
</body>
</html>
